name: dbt CI/CD

on:
  push:
    branches:
      - develop
      - qa
      - main
  workflow_dispatch:

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install dbt-core dbt-snowflake sqlfluff

      - name: Install dbt dependencies
        run: dbt deps

      - name: Run lint check
        run: sqlfluff lint models --dialect snowflake

      - name: Select target environment
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "DBT_TARGET=dev" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "qa" ]]; then
            echo "DBT_TARGET=qa" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "DBT_TARGET=prod" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Debug dbt connection
        run: dbt debug --profiles-dir ./ --target "$DBT_TARGET"

      - name: Run dbt models
        run: dbt run --profiles-dir ./ --target "$DBT_TARGET"

      - name: Run dbt tests
        run: dbt test --profiles-dir ./ --target "$DBT_TARGET"

        
